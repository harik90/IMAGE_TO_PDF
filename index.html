<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>image_to_pdf — private by design client-side tools</title>
  <meta name="description" content="quiet craft client-side image and pdf utilities. zero server uploads, zero tracking.">
  <meta name="theme-color" content="#060709">

  <!-- Favicon and Brand Icons -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta property="og:image" content="/icon.png">
  <meta property="og:title" content="image_to_pdf — private client-side tools">
  <meta property="og:description" content="quiet craft client-side image and pdf utilities. zero server uploads, zero tracking.">

  <!-- Content Security Policy: Self-hosted execution with GitHub Stars API connection only -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' blob: data:; connect-src 'self' ws: wss: https://api.github.com https://api.badgen.net https://img.shields.io blob: data:; worker-src 'self' blob:; script-src 'self' 'wasm-unsafe-eval' 'unsafe-eval' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com;">

  <!-- Fonts: Manrope, Gaegu, IBM Plex Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=IBM+Plex+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Instant Theme Initializer (prevents flash of unstyled theme) -->
  <script>
    (function() {
      try {
        var theme = localStorage.getItem('image_to_pdf_theme') || localStorage.getItem('shapedinto_theme') || 'system';
        var isDark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
